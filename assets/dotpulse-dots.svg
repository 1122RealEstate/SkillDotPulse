<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="title desc">
  <title id="title">Los estados de un emparejamiento, contados con Dots</title>
  <desc id="desc">Cinco Dots, uno por estado: pending, authorized, connected, expired y rejected.</desc>

  <defs>
    <radialGradient id="body" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F1F0FF"/>
      <stop offset="1" stop-color="#D6D1FF"/>
    </radialGradient>
    <radialGradient id="dim" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#F4F4F7"/>
      <stop offset="1" stop-color="#C5C7D3"/>
    </radialGradient>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">

    <!-- pending -->
    <g transform="translate(120 96)">
      <circle r="66" fill="#F5A524" fill-opacity="0.16"/>
      <circle r="54" fill="none" stroke="#F5A524" stroke-width="3" stroke-dasharray="4 9" stroke-linecap="round"/>
      <circle r="42" fill="url(#body)" stroke="#F5A524" stroke-opacity="0.5"/>
      <ellipse cx="-10" cy="-3" rx="6" ry="8" fill="#151A5C"/>
      <ellipse cx="18" cy="-3" rx="6" ry="8" fill="#151A5C"/>
      <circle cx="-7.5" cy="-6" r="2.2" fill="#FFFFFF"/>
      <circle cx="20.5" cy="-6" r="2.2" fill="#FFFFFF"/>
      <circle cx="4" cy="17" r="3.4" fill="#151A5C"/>
      <text y="104" font-size="19" font-weight="700" fill="#D98A0B">pending</text>
      <text y="126" font-size="13.5" fill="#8A8FA8">esperando confirmación</text>
    </g>

    <!-- authorized -->
    <g transform="translate(360 96)">
      <circle r="66" fill="#39D0FF" fill-opacity="0.16"/>
      <circle r="54" fill="none" stroke="#1FB6EA" stroke-width="3"/>
      <circle r="42" fill="url(#body)" stroke="#1FB6EA" stroke-opacity="0.5"/>
      <ellipse cx="-14" cy="-3" rx="6" ry="8" fill="#151A5C"/>
      <ellipse cx="14" cy="-3" rx="6" ry="8" fill="#151A5C"/>
      <circle cx="-16" cy="-6" r="2.2" fill="#FFFFFF"/>
      <circle cx="12" cy="-6" r="2.2" fill="#FFFFFF"/>
      <path d="M-7,14 Q0,22 7,14" fill="none" stroke="#151A5C" stroke-width="3" stroke-linecap="round"/>
      <text y="104" font-size="19" font-weight="700" fill="#1398C7">authorized</text>
      <text y="126" font-size="13.5" fill="#8A8FA8">validado por DotPulse</text>
    </g>

    <!-- connected -->
    <g transform="translate(600 96)">
      <circle r="66" fill="#6C5CFF" fill-opacity="0.18"/>
      <circle r="60" fill="none" stroke="#6C5CFF" stroke-opacity="0.35" stroke-width="2"/>
      <circle r="54" fill="none" stroke="#6C5CFF" stroke-width="3"/>
      <circle r="42" fill="url(#body)" stroke="#6C5CFF" stroke-opacity="0.5"/>
      <path d="M-21,-2 Q-14,-12 -7,-2" fill="none" stroke="#151A5C" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M7,-2 Q14,-12 21,-2" fill="none" stroke="#151A5C" stroke-width="3.4" stroke-linecap="round"/>
      <ellipse cx="-25" cy="10" rx="6" ry="3.6" fill="#FF8FB8" opacity="0.6"/>
      <ellipse cx="25" cy="10" rx="6" ry="3.6" fill="#FF8FB8" opacity="0.6"/>
      <path d="M-8,11 Q0,24 8,11 Z" fill="#E8456F" stroke="#151A5C" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="47" cy="-39" r="6" fill="#39D0FF"/>
      <circle cx="-56" cy="26" r="4" fill="#E05BFF"/>
      <text y="104" font-size="19" font-weight="700" fill="#6C5CFF">connected</text>
      <text y="126" font-size="13.5" fill="#8A8FA8">enlace gestionado por DotPulse</text>
    </g>

    <!-- expired -->
    <g transform="translate(840 96)">
      <circle r="66" fill="#8A8FA8" fill-opacity="0.14"/>
      <circle r="54" fill="none" stroke="#8A8FA8" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
      <circle r="42" fill="url(#dim)" stroke="#8A8FA8" stroke-opacity="0.5"/>
      <path d="M-21,-2 H-7" fill="none" stroke="#4A4E68" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M7,-2 H21" fill="none" stroke="#4A4E68" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M-6,16 H6" fill="none" stroke="#4A4E68" stroke-width="3" stroke-linecap="round"/>
      <text y="104" font-size="19" font-weight="700" fill="#7A7F99">expired</text>
      <text y="126" font-size="13.5" fill="#8A8FA8">el tiempo se agotó</text>
    </g>

    <!-- rejected -->
    <g transform="translate(1080 96)">
      <circle r="66" fill="#F0476E" fill-opacity="0.14"/>
      <circle r="54" fill="none" stroke="#F0476E" stroke-width="3"/>
      <circle r="42" fill="url(#body)" stroke="#F0476E" stroke-opacity="0.5"/>
      <ellipse cx="-14" cy="-1" rx="6" ry="7" fill="#151A5C"/>
      <ellipse cx="14" cy="-1" rx="6" ry="7" fill="#151A5C"/>
      <path d="M-23,-13 L-8,-9" fill="none" stroke="#151A5C" stroke-width="3" stroke-linecap="round"/>
      <path d="M23,-13 L8,-9" fill="none" stroke="#151A5C" stroke-width="3" stroke-linecap="round"/>
      <path d="M-7,19 Q0,13 7,19" fill="none" stroke="#151A5C" stroke-width="3" stroke-linecap="round"/>
      <text y="104" font-size="19" font-weight="700" fill="#E0345D">rejected</text>
      <text y="126" font-size="13.5" fill="#8A8FA8">no aceptado</text>
    </g>
  </g>
</svg>
