<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Cómo se conecta DotPulse</title>
  <desc id="desc">Cuatro pasos: la app DotPulse genera un Pairing ID, el usuario lo pega en Hermes o Telegram, DotPulse lo valida y queda conectado. Sin un Pairing ID válido no ocurre nada.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08081C"/>
      <stop offset="0.6" stop-color="#140F3C"/>
      <stop offset="1" stop-color="#23125A"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39D0FF"/>
      <stop offset="0.5" stop-color="#8B7BFF"/>
      <stop offset="1" stop-color="#E05BFF"/>
    </linearGradient>
    <linearGradient id="wire" gradientUnits="userSpaceOnUse" x1="222" y1="0" x2="978" y2="0">
      <stop offset="0" stop-color="#39D0FF"/>
      <stop offset="0.5" stop-color="#8B7BFF"/>
      <stop offset="1" stop-color="#E05BFF"/>
    </linearGradient>
    <radialGradient id="body" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#EEECFF"/>
      <stop offset="1" stop-color="#C9C3FF"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#FFFFFF" opacity="0.06"/>
    </pattern>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .wire { stroke-dasharray: 3 9; animation: flow 1.4s linear infinite; }
    .node { transform-box: fill-box; transform-origin: center; animation: breathe 4s ease-in-out infinite; }
    .n2 { animation-delay: .5s; } .n3 { animation-delay: 1s; } .n4 { animation-delay: 1.5s; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @keyframes breathe { 0%, 100% { transform: scale(1); opacity: .5; } 50% { transform: scale(1.12); opacity: .15; } }
    @media (prefers-reduced-motion: reduce) { .wire, .node { animation: none; } }
  </style>

  <rect width="1200" height="380" rx="32" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="32" fill="url(#grid)"/>

  <!-- cables -->
  <g fill="none" stroke="url(#wire)" stroke-width="2.5" stroke-linecap="round">
    <path class="wire" d="M222,128 H378"/>
    <path class="wire" d="M522,128 H678"/>
    <path class="wire" d="M822,128 H978"/>
  </g>
  <g fill="#FFFFFF">
    <circle r="4.5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M222,128 H378"/></circle>
    <circle r="4.5"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M522,128 H678"/></circle>
    <circle r="4.5"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M822,128 H978"/></circle>
  </g>

  <g class="sans" text-anchor="middle">

    <!-- 1 · app -->
    <g transform="translate(150 128)">
      <circle class="node" r="70" fill="none" stroke="#39D0FF" stroke-width="2"/>
      <circle r="58" fill="#FFFFFF" fill-opacity="0.06" stroke="#39D0FF" stroke-opacity="0.8" stroke-width="2"/>
      <rect x="-19" y="-33" width="38" height="66" rx="9" fill="#0B0B22" stroke="#FFFFFF" stroke-width="2.4"/>
      <circle cy="-3" r="11" fill="url(#body)"/>
      <circle cx="-3.6" cy="-4" r="1.7" fill="#151A5C"/>
      <circle cx="3.6" cy="-4" r="1.7" fill="#151A5C"/>
      <rect x="-9" y="17" width="18" height="5" rx="2.5" fill="#39D0FF"/>
      <text y="100" font-size="20" font-weight="700" fill="#FFFFFF">DotPulse App</text>
      <text y="124" font-size="14.5" fill="#BDB9EE">pulsas «Copiar conexión»</text>
    </g>

    <!-- 2 · pairing id -->
    <g transform="translate(450 128)">
      <circle class="node n2" r="70" fill="none" stroke="#8B7BFF" stroke-width="2"/>
      <circle r="58" fill="#FFFFFF" fill-opacity="0.06" stroke="#8B7BFF" stroke-opacity="0.9" stroke-width="2"/>
      <rect x="-38" y="-17" width="76" height="34" rx="9" fill="#0B0B22" stroke="#FFFFFF" stroke-width="2.4"/>
      <text y="5.5" font-size="14" font-weight="700" letter-spacing="1" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">DPP1-…</text>
      <g transform="translate(30 -24)">
        <circle r="11" fill="#140F3C" stroke="#F5A524" stroke-width="2.2"/>
        <path d="M0,-5 V0 L4,3" fill="none" stroke="#F5A524" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text y="100" font-size="20" font-weight="700" fill="#FFFFFF">Pairing ID</text>
      <text y="124" font-size="14.5" fill="#BDB9EE">temporal · un solo uso</text>
    </g>

    <!-- 3 · hermes / telegram -->
    <g transform="translate(750 128)">
      <circle class="node n3" r="70" fill="none" stroke="#B46BFF" stroke-width="2"/>
      <circle r="58" fill="#FFFFFF" fill-opacity="0.06" stroke="#B46BFF" stroke-opacity="0.9" stroke-width="2"/>
      <path d="M-30,-24 H30 A8,8 0 0 1 38,-16 V10 A8,8 0 0 1 30,18 H-6 L-22,31 V18 H-30 A8,8 0 0 1 -38,10 V-16 A8,8 0 0 1 -30,-24 Z" fill="#0B0B22" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round"/>
      <circle cx="-16" cy="-3" r="3.6" fill="#39D0FF"/>
      <circle cx="0" cy="-3" r="3.6" fill="#8B7BFF"/>
      <circle cx="16" cy="-3" r="3.6" fill="#E05BFF"/>
      <text y="100" font-size="20" font-weight="700" fill="#FFFFFF">Hermes / Telegram</text>
      <text y="124" font-size="14.5" fill="#BDB9EE">lo pegas · DotPulse lo valida</text>
    </g>

    <!-- 4 · conectado -->
    <g transform="translate(1050 128)">
      <circle class="node n4" r="70" fill="none" stroke="#E05BFF" stroke-width="2"/>
      <circle r="58" fill="#FFFFFF" fill-opacity="0.06" stroke="#E05BFF" stroke-opacity="0.9" stroke-width="2"/>
      <circle r="30" fill="url(#body)"/>
      <path d="M-15,-3 Q-10,-10 -5,-3" fill="none" stroke="#151A5C" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M5,-3 Q10,-10 15,-3" fill="none" stroke="#151A5C" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M-6,7 Q0,16 6,7 Z" fill="#E8456F" stroke="#151A5C" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="35" cy="-35" r="12" fill="#22C58B" stroke="#140F3C" stroke-width="3"/>
      <path d="M30,-35 L33.8,-31 L40.5,-39" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="100" font-size="20" font-weight="700" fill="#FFFFFF">DotPulse conectado</text>
      <text y="124" font-size="14.5" fill="#BDB9EE">el enlace lo mantiene DotPulse</text>
    </g>

    <!-- la regla -->
    <g transform="translate(600 318)">
      <rect x="-420" y="-25" width="840" height="50" rx="25" fill="#0B0B22" fill-opacity="0.65" stroke="url(#brand)" stroke-opacity="0.75" stroke-width="1.5"/>
      <g transform="translate(-392 -12)" fill="none" stroke="#39D0FF" stroke-width="2.2" stroke-linecap="round">
        <rect x="0" y="9" width="18" height="14" rx="3.5"/>
        <path d="M4 9V6a5 5 0 0 1 10 0V9"/>
      </g>
      <text x="14" y="6" font-size="17" font-weight="600" fill="#F2F1FF">Sin un Pairing ID válido no ocurre nada. La Skill sola no da acceso a ningún dispositivo.</text>
    </g>
  </g>
</svg>
